<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ImageGrab logo">
  <title>ImageGrab</title>
  <defs>
    <linearGradient id="igLogoGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <!-- rounded square with the blue to violet gradient -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#igLogoGradient)" />

  <!-- white photo frame -->
  <rect x="12.2" y="12.2" width="39.6" height="39.6" rx="5.8" fill="none" stroke="#ffffff" stroke-width="3.6" />

  <!-- sun -->
  <circle cx="23.7" cy="24.3" r="3.7" fill="#ffffff" />

  <!-- hill -->
  <path d="M19.2 44.2 L32 25.6 L44.8 44.2 Z" fill="#ffffff" />
</svg>
