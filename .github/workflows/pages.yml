name: 测试并发布官网到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 官方发布方式所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布流程，新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: 测试与打包校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 浏览器测试用 Node 内建的全局 WebSocket 连接 CDP。Node 20 没有这个全局对象，
          # 会直接抛 ReferenceError: WebSocket is not defined；22 起默认开启（22.4 稳定）。
          # 这里固定成与本地开发一致的版本，避免再出现「本地过、CI 不过」。
          node-version: '24'

      - name: Node 单元测试
        run: node tests/run-tests.js

      - name: 按 extension/ 重新打包
        run: npm run build:zip

      - name: 校验 ZIP 与 extension/ 一致
        run: npm run verify:zip

      # build:zip 会覆盖仓库里那份 ZIP，所以必须再比对一次：
      # 若仓库中的 ZIP 与源码不一致，说明安装包过期，应当失败
      - name: 确认仓库里的 ZIP 与源码一致（没有过期的安装包）
        run: git diff --exit-code -- docs/downloads/imagegrab.zip

      # ubuntu runner 自带 Chrome；容器里跑 Chromium 需要关掉它自己的沙箱
      - name: 浏览器测试（采集 / 展示页 / 官网自检）
        env:
          IG_BROWSER_ARGS: --no-sandbox --disable-dev-shm-usage
        run: node tests/browser/run-browser-tests.js

  deploy:
    name: 发布到 GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与 test job 保持一致：Node 版本必须自带全局 WebSocket
          node-version: '24'

      # 上传前重新打包，保证发布的安装包由这份源码现打现用
      - name: 按 extension/ 重新打包
        run: npm run build:zip

      - uses: actions/configure-pages@v5

      # 站点就是 docs/ 目录本身，整目录上传（安装包已在上面按源码重新打包）
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
